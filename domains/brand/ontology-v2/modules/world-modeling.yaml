module_id: world://ontology/module/brand/world-modeling
version: 2.0.0-candidate
status: candidate
imports: [world://ontology/module/brand/core]
competency_questions:
  - Can a scoped state remain separate from conflicting claims and evidence about it?
  - Can one campaign situation bind an offering, audience, market, channel, objective, and budget without flattening those roles?
  - Can customer and internal perspectives interpret the same records without modifying shared knowledge?
  - Can a branch preserve a scenario difference without replacing the accepted world?
  - Can a proposed marketing effect be tested and learned from without turning the expectation into an observed result?
evidence_basis: [research:brand-ontology-constitution, research:customer-experience]
entity_types:
  - {id: world://ontology/brand/type/StateSnapshot, label: State snapshot, definition: "A versioned modeled condition for one or more subjects in a bounded context and time.", examples: ["Nike App onboarding completion in Germany"], counterexamples: ["A team opinion about onboarding."]}
  - {id: world://ontology/brand/type/PerspectiveProfile, label: Perspective profile, definition: "A situated viewpoint with bounded access, assumptions, goals, and limitations.", examples: ["First-time runner customer perspective"], counterexamples: ["A shared brand fact."]}
  - {id: world://ontology/brand/type/WorldBranch, label: World branch, definition: "A scoped overlay containing explicit assumptions and differences from a parent world view.", examples: ["Confidence-first positioning scenario"], counterexamples: ["The accepted Brand world being overwritten."]}
  - {id: world://ontology/brand/type/RelationshipFrame, label: Relationship frame, definition: "A context-bound relationship with several named participant roles and constraints.", examples: ["Nike App acquisition campaign targeting frame"], counterexamples: ["A bare unqualified graph edge."]}
  - {id: world://ontology/brand/type/HypothesisRecord, label: Hypothesis record, definition: "A falsifiable proposed effect with assumptions, alternatives, evidence roles, and conditions that could weaken it.", examples: ["Clearer membership benefits may improve qualified starts for a defined audience."], counterexamples: ["A measured experiment result."]}
  - {id: world://ontology/brand/type/ExperimentPlan, label: Experiment plan, definition: "A governed protocol for testing one or more hypotheses against a comparison or control.", examples: ["A randomized member-discovery test with success and guardrail metrics."], counterexamples: ["A forecast presented as an experiment result."]}
  - {id: world://ontology/brand/type/LearningUpdate, label: Learning update, definition: "A reviewed interpretation of observed outcomes that marks dependent records for consideration without changing them automatically.", examples: ["A reviewed finding that strengthens a hypothesis."], counterexamples: ["An automatic strategy rewrite."]}
relationship_types:
  - {id: world://ontology/brand/relation/describes-state, label: describes state, definition: "A claim describes a StateSnapshot in its declared context without becoming identical to that state.", family: epistemic, source_type_ids: [world://ontology/brand/type/ResearchObservation, world://ontology/brand/type/Measurement, world://ontology/brand/type/ObservedOutcome], target_type_ids: [world://ontology/brand/type/StateSnapshot], examples: ["Measurement describes onboarding completion state."], counterexamples: ["A state proves every claim about it."]}
  - {id: world://ontology/brand/relation/interprets, label: interprets, definition: "A PerspectiveProfile interprets a state or relationship frame from its bounded viewpoint.", family: perspectival, source_type_ids: [world://ontology/brand/type/PerspectiveProfile], target_type_ids: [world://ontology/brand/type/StateSnapshot, world://ontology/brand/type/RelationshipFrame], examples: ["Customer perspective interprets onboarding state."], counterexamples: ["A perspective rewrites the state for every user."]}
  - {id: world://ontology/brand/relation/branches-from, label: branches from, definition: "A WorldBranch is an explicit alternate view derived from another branch or accepted world context.", family: epistemic, source_type_ids: [world://ontology/brand/type/WorldBranch], target_type_ids: [world://ontology/brand/type/WorldBranch], examples: ["Confidence scenario branches from accepted strategy."], counterexamples: ["A scenario silently replaces its parent."]}
  - {id: world://ontology/brand/relation/qualifies, label: qualifies, definition: "A RelationshipFrame qualifies a product, campaign, asset, or decision using named roles and constraints.", family: context, source_type_ids: [world://ontology/brand/type/RelationshipFrame], target_type_ids: [world://ontology/brand/type/Offering, world://ontology/brand/type/Campaign, world://ontology/brand/type/Asset, world://ontology/brand/type/StrategyDecision], examples: ["Campaign frame qualifies Nike App acquisition."], counterexamples: ["A frame makes its members identical."]}
  - {id: world://ontology/brand/relation/tests, label: tests, definition: "An ExperimentPlan tests a HypothesisRecord under its declared protocol and scope.", family: learning, source_type_ids: [world://ontology/brand/type/ExperimentPlan], target_type_ids: [world://ontology/brand/type/HypothesisRecord], examples: ["An experiment tests a member-discovery hypothesis."], counterexamples: ["An outcome tests itself."]}
  - {id: world://ontology/brand/relation/produces-outcome, label: produces outcome, definition: "A completed ExperimentPlan produces an ObservedOutcome without proving a hypothesis by itself.", family: learning, source_type_ids: [world://ontology/brand/type/ExperimentPlan], target_type_ids: [world://ontology/brand/type/ObservedOutcome], examples: ["A completed test produces a measured outcome."], counterexamples: ["An expected result before completion."]}
  - {id: world://ontology/brand/relation/informs-learning, label: informs learning, definition: "An ObservedOutcome informs a reviewed LearningUpdate under its measured scope and limitations.", family: learning, source_type_ids: [world://ontology/brand/type/ObservedOutcome], target_type_ids: [world://ontology/brand/type/LearningUpdate], examples: ["An outcome informs a reviewed learning update."], counterexamples: ["An outcome silently updates strategy."]}
