[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testflight-adapter-sqlite-workflow-runtime"
version = "0.1.0"
description = "Durable SQLite run and idempotency storage for Testflight workflows"
requires-python = ">=3.12,<3.14"
dependencies = ["testflight-core", "testflight-workflows"]

[tool.uv.sources]
testflight-core = { workspace = true }
testflight-workflows = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/testflight_adapter_sqlite_workflow_runtime"]
