[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testflight-adapter-mcp-workflows"
version = "0.1.0"
description = "MCP and HTTP transport adapter for the Testflight workflow runtime"
requires-python = ">=3.12,<3.14"
dependencies = ["mcp==2.1.1", "testflight-core", "testflight-workflows"]

[tool.uv.sources]
testflight-core = { workspace = true }
testflight-workflows = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/testflight_adapter_mcp_workflows"]
