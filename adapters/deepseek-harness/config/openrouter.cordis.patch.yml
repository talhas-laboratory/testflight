# OpenRouter is an OpenAI-compatible hand-declared route for dsh-llm-pi-ai.
# The launcher supplies TESTFLIGHT_DSH_MODEL; no model or credential is stored here.
- id: agent-default-model
  config:
    provider: openrouter
    model: !!js process.env.TESTFLIGHT_DSH_MODEL

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      openrouter:
        displayName: OpenRouter
        apiKeyEnv: OPENROUTER_API_KEY
        api: openai-completions
        baseURL: !!js process.env.TESTFLIGHT_DSH_BASE_URL ?? 'https://openrouter.ai/api/v1'
        models:
          - id: !!js process.env.TESTFLIGHT_DSH_MODEL
            name: !!js process.env.TESTFLIGHT_DSH_MODEL
