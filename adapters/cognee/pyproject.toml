[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testflight-adapter-cognee"
version = "0.1.0"
description = "Optional Cognee integration boundary for Testflight"
requires-python = ">=3.12,<3.14"
dependencies = ["testflight-core"]

[project.optional-dependencies]
cognee = ["cognee==1.5.0"]

[tool.uv.sources]
testflight-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/testflight_adapter_cognee"]
