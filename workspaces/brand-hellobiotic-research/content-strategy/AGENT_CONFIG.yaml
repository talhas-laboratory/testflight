version: 1
container_id: "world://workspace/brand/hellobiotic-research/content-strategy"
parent_workspace_id: "world://workspace/brand/hellobiotic-research"
dataset_name: "testflight_brand_hellobiotic_research_content_strategy_staging"
route: "content-strategy"
status: candidate_foundation
classification: internal_strategy
authority:
  strategic_direction: founder_authored
  customer_claims: evidence_required
  scientific_and_health_claims: evidence_and_review_required
  external_publication: explicit_authorization_required
retrieval:
  container_ids:
    - "world://workspace/brand/hellobiotic-research/content-strategy"
  primary: bm25
  fallback: bounded_same_child_hybrid
  graph_max_hops: 2
  out_of_domain: NO_HITS
  reject_navigation_as_answer: true
metadata_contract:
  required:
    - module
    - unit
    - task_view
    - tool
    - doc_type
    - evidence_tier
    - experience_type
    - difficulty
    - canonical
    - last_verified_at
    - source_url
quality_gates:
  top_1_precision_min: 0.90
  routing_error_max: 0.03
  query_failure_max: 0.005
  no_hit_correctness: 1.0
  content_generation:
    manifest_revision_required: true
    relational_rationale_required: true
    source_trace_required_for_factual_claims: true
    scientific_claim_review_required: true
    individual_inference_without_evidence: prohibited
    publish_without_authorization: prohibited
operators:
  - configuration-runtime@1
  - workspace-isolation@1
  - retrieval-reasoning-conflation@1
  - evaluation-schema@1
  - boundary-conflation@1
  - ontology-conflation@1
