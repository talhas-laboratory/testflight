perspectives:
  - perspective_id: PERS-NIKE-MEMBER-PROSPECTIVE-001
    holder_id: ENT-NIKE-EN-017
    perspective_type_id: world://ontology/brand/perspective/prospective-member
    context_id: CTX-NIKE-DIGITAL-MEMBERSHIP-CURRENT
    goals:
      - Understand the practical membership value before joining or engaging.
      - Discover relevant products, guidance, stories, and experiences.
    accessible_record_selectors: [ENT-NIKE-OF-005, ENT-NIKE-OF-006, ENT-NIKE-XP-003, ENT-NIKE-XP-004]
    salience_rules:
      - Prioritize clearly documented member benefits and app discovery features.
      - Do not imply a benefit, experience, or personalization outcome that the public evidence does not state.
    known_limitations:
      - Does not establish an individual member's preferences, eligibility, or access in a specific market.
      - Does not provide Nike's private UX, legal, accessibility, or approval requirements.
    derivation_id: DERIV-NIKE-WORLD-MODEL-001

