hypotheses:
  - hypothesis_id: HYP-NIKE-MEMBER-BENEFIT-CLARITY-001
    branch_id: BR-NIKE-MEMBER-DISCOVERY-LENS-001
    context_id: CTX-NIKE-DIGITAL-MEMBERSHIP-CURRENT
    input_ids: [FRAME-NIKE-MEMBER-APP-DISCOVERY-001, STATE-NIKE-MEMBERSHIP-SERVICE-001]
    proposition: Clearer framing of documented Nike Membership benefits may increase qualified membership starts in a defined prospective-member population.
    mechanism_description: A prospective member can more easily connect published access, rewards, experiences, and guidance to their own needs.
    input_evidence_link_ids: [EVIDLINK-NIKE-MEMBER-004]
    supporting_evidence_link_ids: []
    assumption_ids: [PERS-NIKE-MEMBER-PROSPECTIVE-001]
    falsification_conditions:
      - A permitted controlled test shows no improvement or worse qualified membership starts against the declared comparison.
      - The proposed population does not find the clarified benefits materially more understandable in validated research.
    status: testable
    derivation_id: DERIV-NIKE-WORLD-MODEL-001

experiments:
  - experiment_id: EXP-NIKE-MEMBER-BENEFIT-CLARITY-001
    hypothesis_ids: [HYP-NIKE-MEMBER-BENEFIT-CLARITY-001]
    branch_id: BR-NIKE-MEMBER-DISCOVERY-LENS-001
    context_id: CTX-NIKE-DIGITAL-MEMBERSHIP-CURRENT
    intervention: Present a clear, evidence-backed explanation of documented membership benefits before Nike App discovery.
    comparison_or_control: Use the approved current member-discovery sequence or another explicitly documented control.
    population_selector: Eligible prospective members in a market where the test is authorized.
    assignment_method: Determine and record the permitted assignment method before approval.
    metric_ids: [METRIC-NIKE-QUALIFIED-MEMBERSHIP-STARTS]
    success_thresholds:
      - metric_id: METRIC-NIKE-QUALIFIED-MEMBERSHIP-STARTS
        comparator: greater_than
        value: 0
        unit_id: unit:percentage-points
    guardrail_metric_ids: [METRIC-NIKE-MEMBER-EXPERIENCE-QUALITY]
    time_window:
      from_time: '2026-09-01T00:00:00Z'
      to_time: '2026-09-30T00:00:00Z'
    sample_requirements: Define a permitted sample-size and stopping-rule calculation before approval.
    risk_and_ethics_constraints:
      - Use only consented data and an authorized market, product, and channel.
      - Do not represent the test as an approved Nike initiative in this public research workspace.
    status: draft
    derivation_id: DERIV-NIKE-WORLD-MODEL-001

