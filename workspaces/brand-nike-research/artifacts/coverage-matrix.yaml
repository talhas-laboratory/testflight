known_gaps:
  - id: GAP-NIKE-001
    area: proprietary_brand_governance
    consequence: Public evidence cannot establish final design, legal, trademark, or brand approval requirements.
    required_source: authorized_internal_nike_standard
  - id: GAP-NIKE-002
    area: detailed_ICP_economics_and_behavior
    consequence: Audience profiles are bounded research interpretations, not validated commercial segments.
    required_source: authorized_customer_research_or_segment_definition
  - id: GAP-NIKE-003
    area: campaign_effectiveness
    consequence: Campaign intent cannot establish perception or behavior change.
    required_source: compatible_independent_or_first_party_outcome_measurement
  - id: GAP-NIKE-004
    area: competitive_positioning_comparability
    consequence: Competitor self-positioning and Nike perception scores answer different questions.
    required_source: common_method_multi_brand_study
  - id: GAP-NIKE-005
    area: feedback_and_causality
    consequence: Public temporal sequence cannot prove that external perception caused strategy changes.
    required_source: decision_record_or_direct_executive_statement
