version: 1
container_id: world://workspace/testflight-product/product-definition
status: candidate
required_classes: [exact_artifact, intent_route, adversarial_navigation, out_of_domain_no_hit]
probes:
  - {id: exact-contract, class: exact_artifact, query: product-definition module contract, expected_source: artifacts/module-contract.yaml, expected_status: hit}
  - {id: route-capability, class: intent_route, query: "What capabilities does Testflight expose?", expected_status: hit_or_no_hit}
  - {id: reject-index, class: adversarial_navigation, query: "What is Testflight's product character?", reject_sources: [AGENT_INDEX.md, AGENT_CONFIG.yaml], expected_status: hit}
  - {id: no-hit, class: out_of_domain_no_hit, query: "What is the population of Saturn?", expected_status: NO_HITS}
