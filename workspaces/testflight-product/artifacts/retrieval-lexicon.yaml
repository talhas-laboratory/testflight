version: 1
workspace_id: world://workspace/testflight-product
status: active
routes:
  product-definition:
    terms: [product, identity, principle, portfolio, offer, capability, surface, workflow, roadmap, requirement, founder, world-seeder]
    artifacts: [product-portfolio.yaml, capability-inventory.yaml, roadmap-inventory.yaml, product-surface-inventory.yaml]
  product-decisions:
    terms: [decision, proposal, alternative, tradeoff, authority, accept, reject, hold, branch, supersede, ADR]
    artifacts: [decision-catalog.yaml]
  experience-design:
    terms: [design, UI, UX, interface, language, aesthetic, color, typography, spacing, motion, component, pattern, accessibility, token]
    artifacts: [design-language.yaml, surface-pattern-inventory.yaml, tokens.json, tokens.css]
  architecture:
    terms: [architecture, application, app, package, adapter, upstream, interface, API, runtime, database, deployment, dependency, server]
    artifacts: [system-inventory.yaml, dependency-map.yaml, upstreams/registry.yaml]
  customers-market:
    terms: [customer, user, founder, buyer, champion, segment, need, journey, feedback, competitor, market, interview]
    artifacts: [actor-market-inventory.yaml, journey-inventory.yaml]
  marketing-growth:
    terms: [positioning, narrative, message, campaign, channel, acquisition, activation, retention, growth, GTM]
    artifacts: [positioning-offer-inventory.yaml]
  finance-commercial:
    terms: [price, pricing, revenue, cost, budget, forecast, contract, ARR, onboarding, unit-economics, ROI, value]
    artifacts: [commercial-hypotheses.yaml]
  operations-governance:
    terms: [role, responsibility, process, policy, control, permission, risk, compliance, incident, service, operation, quality]
    artifacts: [operating-model.yaml, risk-register.yaml]
  research-learning:
    terms: [research, source, question, evidence, hypothesis, experiment, metric, evaluation, outcome, learning, limitation]
    artifacts: [research-catalog.yaml]
utility_document_policy:
  navigation: [AGENT_INDEX.md]
  policy: [AGENT_CONFIG.yaml]
  registry: [resource_registry.json, source_manifest.yaml, module-registry.yaml]
  reject_as_domain_answer_unless_intent_matches: true

