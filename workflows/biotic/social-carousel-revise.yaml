schema_version: 1
id: workflow://testflight/biotic/social-carousel-revise
version: 1
lifecycle: candidate
name: Biotic social carousel revision
description: Create a successor bundle while preserving unaffected approved-for-review outputs.
tags: [biotic, public-research, social, creative, revision]
access: {public: false, agent_ids: [agent:testflight-biotic]}
knowledge:
  workspace_ids: [world://workspace/brand/hellobiotic-research]
  container_ids: [world://workspace/brand/hellobiotic-research]
  entity_ids: [ENT-HB-ID-001, ENT-HB-OF-001, CTX-HELLOBIOTIC-DEODORANT-CURRENT]
  entity_types: [brand, offering, context, claim, visual_observation]
  branch_ids: [research-main]
  data_classifications: [public]
  max_results: 20
  max_graph_hops: 2
authority:
  capabilities: [artifact.retrieve, artifact.revise, artifact.persist]
  action_ids: [action://testflight/creative/local-artifact-persist]
  credential_refs: [credential://testflight/workflow-runtime]
  proposal_write: true
  canonical_write: false
  external_action: true
inputs_schema:
  type: object
  additionalProperties: false
  required: [request_id, bundle_id, card_positions, revision_instruction]
  properties:
    request_id: {type: string}
    bundle_id: {type: string}
    card_positions: {type: array}
    revision_instruction: {type: string}
outputs_schema:
  type: object
  additionalProperties: false
  required: [review_bundle]
  properties: {review_bundle: {type: object}}
steps:
  - id: load_bundle
    kind: retrieve
    handler: biotic.load_artifact_bundle
    description: Load only a Biotic bundle from the configured local artifact project.
    instruction:
      id: instruction://testflight/biotic/load-artifact-bundle
      version: 1
      objective: Retrieve a reviewable local artifact without widening project scope.
      rules: [Return hold for missing or foreign-project bundles.]
    arguments: {bundle_id: $inputs.bundle_id}
    access:
      workspace_ids: [world://workspace/brand/hellobiotic-research]
      container_ids: [world://workspace/brand/hellobiotic-research]
    capabilities: [artifact.retrieve]
  - id: revise_carousel
    kind: transform
    handler: biotic.revise_social_carousel
    description: Replace selected cards and copy while retaining unchanged image outputs by identity.
    instruction:
      id: instruction://testflight/biotic/revise-social-carousel
      version: 1
      objective: Make the requested targeted revision without losing source scope or unaffected work.
      rules:
        - Keep unselected card outputs unchanged.
        - Reject unsupported medical, performance, or customer-behavior claims.
        - Mark the successor as public-research concept work pending human review.
    needs: [load_bundle]
    arguments:
      request_id: $inputs.request_id
      source_bundle: $steps.load_bundle.output
      card_positions: $inputs.card_positions
      revision_instruction: $inputs.revision_instruction
    capabilities: [artifact.revise]
  - id: persist_revision
    kind: action
    handler: biotic.persist_local_artifact_bundle
    description: Persist the successor bundle as a new review-needed revision.
    instruction:
      id: instruction://testflight/biotic/persist-artifact-revision
      version: 1
      objective: Persist only a proposal successor with an immutable parent relationship.
      rules: [Use request id as idempotency key and never publish.]
    needs: [revise_carousel]
    arguments: {carousel: $steps.revise_carousel.output}
    capabilities: [artifact.persist]
    action_ids: [action://testflight/creative/local-artifact-persist]
    idempotency_key: $inputs.request_id
    on_error: hold
outputs: {review_bundle: $steps.persist_revision.output}
