schema_version: 1
id: workflow://testflight/biotic/newsletter-compose
version: 3
lifecycle: candidate
name: Biotic relational newsletter composition
description: >-
  Form an evidence-aware, field-first Biotic newsletter content plan and draft for human editorial
  review. This workflow never sends or publishes.
tags: [biotic, newsletter, relational-content, proposal-only]

access:
  public: false
  agent_ids: [agent:hellobiotic-newsletter-strategist]

knowledge:
  workspace_ids: [world://workspace/brand/hellobiotic-research/content-strategy, world://workspace/brand/hellobiotic-research]
  container_ids: [world://workspace/brand/hellobiotic-research/content-strategy, world://workspace/brand/hellobiotic-research]
  allow_cross_workspace: true
  entity_types: [field_of_engagement, tension_or_question, practice, brand, product, content_contribution, evidence]
  data_classifications: [internal, public_research]
  max_results: 20
  max_graph_hops: 2

authority:
  capabilities: [knowledge.retrieve, world:read, reasoning.compose, content.plan, content.packet, content.draft, content.evaluate, model.invoke]
  credential_refs: [credential://testflight/workflow-runtime]
  proposal_write: false
  canonical_write: false
  external_action: false

inputs_schema:
  type: object
  additionalProperties: false
  required: [request_id, issue_objective, audience_context, evidence_packet, current_field_signals, prior_issue_feedback, authorized_product_context]
  properties:
    request_id: {type: string}
    issue_objective: {type: string}
    audience_context: {type: object}
    evidence_packet: {type: array}
    current_field_signals: {type: array}
    prior_issue_feedback: {type: array}
    authorized_product_context: {type: object}

outputs_schema:
  type: object
  additionalProperties: false
  required: [review_package]
  properties:
    review_package: {type: object}

steps:
  - id: compile_relational_context
    kind: retrieve
    handler: biotic.compile_newsletter_context
    description: >-
      Compile a bounded relational packet with a declared personalization mode, traceable evidence,
      and a scoped read-only Brand World v3 packet that all later nodes must preserve.
    instruction:
      id: instruction://testflight/biotic/newsletter/compile-relational-context
      version: 1
      objective: Preserve the relational field without turning strategic hypotheses into customer or scientific facts.
      rules:
        - Treat founder strategy as an editorial constraint, never as evidence about readers.
        - Require audience source status plus source refs; unknown status permits broad issues only.
        - Require an evidence_id, source ref, evidence status, and limitations for each factual input.
        - Preserve uncertainty, evidence limitations, product authorization limits, and the lack of publication authority.
        - Treat Brand World v3 material as public-research proposals; never upgrade it to an approved brand fact.
    arguments:
      issue_objective: $inputs.issue_objective
      audience_context: $inputs.audience_context
      evidence_packet: $inputs.evidence_packet
      current_field_signals: $inputs.current_field_signals
      prior_issue_feedback: $inputs.prior_issue_feedback
      authorized_product_context: $inputs.authorized_product_context
    access:
      workspace_ids: [world://workspace/brand/hellobiotic-research/content-strategy, world://workspace/brand/hellobiotic-research]
      container_ids: [world://workspace/brand/hellobiotic-research/content-strategy, world://workspace/brand/hellobiotic-research]
      entity_types: [field_of_engagement, tension_or_question, practice, brand, product, content_contribution, evidence]
    capabilities: [knowledge.retrieve, world:read]
    on_error: hold

  - id: compose_issue
    kind: transform
    handler: biotic.compose_newsletter_issue
    description: >-
      Explore plausible relational compositions, select one editorial direction, and record the
      assumptions that make it suitable for this issue.
    instruction:
      id: instruction://testflight/biotic/newsletter/compose-issue
      version: 1
      objective: Select a field-first reader contribution that can earn Biotic's participation.
      rules:
        - Consider two or three materially distinct compositions before selecting one.
        - Score each candidate against field centrality, lived stake, contribution value, brand legitimacy, and reader independence.
        - Choose one field, reader question, contribution, moment, mode, and bounded legitimacy basis.
        - A product role is optional; product adjacency cannot establish relevance or outrank reader value.
        - Never infer an individual’s identity, health, insecurity, or motive.
        - If the field, stake, or legitimacy is unsupported, choose branch, ask, broad_issue, or hold rather than inventing certainty.
        - Use only the supplied context packet and return proposal-only JSON.
      prompt:
        id: prompt://testflight/biotic/newsletter/compose-issue
        version: 1
        operator_id: runtime://testflight/workflow/prompt-step
        operator_version: 1
        modality: text/plain
        system: |
          You are Biotic's relational newsletter strategist. Work only with the supplied packet.
          A composition is an inspectable editorial hypothesis, never a customer fact or scientific conclusion.
          First form a small portfolio of genuinely different ways this issue could matter. Then select
          the composition with the strongest reader-independent contribution and honest Biotic legitimacy.
          Preserve source status, personalization mode, product limits, and every unresolved assumption.
          Return JSON matching the schema exactly. Never authorize publication.
        user: |
          Issue objective: {{ arguments.issue_objective }}
          Bounded context packet: {{ arguments.context }}
        output_schema:
          type: object
          additionalProperties: false
          required: [composition_id, decision, candidates, selected_candidate_id, selected, assumptions, uncertainty_notes, publication_status]
          properties:
            composition_id: {type: string}
            decision: {type: string}
            candidates: {type: array}
            selected_candidate_id: {type: string}
            selected: {type: object}
            assumptions: {type: array}
            uncertainty_notes: {type: array}
            publication_status: {type: string, const: proposal_only}
        configuration: {reasoning_effort: low}
    needs: [compile_relational_context]
    arguments:
      issue_objective: $inputs.issue_objective
      context: $steps.compile_relational_context.output
    access:
      workspace_ids: [world://workspace/brand/hellobiotic-research/content-strategy]
      container_ids: [world://workspace/brand/hellobiotic-research/content-strategy]
      entity_types: [field_of_engagement, tension_or_question, practice, brand, product, content_contribution, evidence]
    capabilities: [reasoning.compose, model.invoke]
    on_error: hold

  - id: form_content_plan
    kind: transform
    handler: biotic.form_newsletter_content_plan
    description: >-
      Translate the selected composition into a writer-facing plan that locks meaning and claim
      boundaries while leaving language-level craft appropriately open.
    instruction:
      id: instruction://testflight/biotic/newsletter/form-content-plan
      version: 1
      objective: Specify the complete newsletter's content and artifact characteristics without over-controlling prose.
      rules:
        - Preserve the selected composition_id, field, reader question, contribution, and product role.
        - Lock the controlling idea, reader promise, contribution, claim boundaries, product role, and CTA boundary.
        - Make audience calibration, rhetoric, voice, structure, visual character, and length directional.
        - Leave exact wording, transitions, metaphors, rhythm, image choices, and title alternatives open.
        - "Build an issue arc: recognition → useful distinction → explanation → practical implication → closing invitation."
        - Include only factual claims that resolve to supplied evidence_ids and state how each may be expressed.
        - The product can be none, contextual, illustrative, practical, or central_and_justified; justify every non-none role.
        - Write a concise creative_brief that makes the intended intellectual and emotional movement legible to a blank writing agent.
      prompt:
        id: prompt://testflight/biotic/newsletter/form-content-plan
        version: 1
        operator_id: runtime://testflight/workflow/prompt-step
        operator_version: 1
        modality: text/plain
        system: |
          You turn a selected relational composition into a copywriter-ready content plan.
          The plan must be vivid enough to guide a small writing model and open enough for alive prose.
          Preserve the composition_id exactly. Do not replace reader value with product pressure.
          `locked` is non-negotiable meaning: controlling idea, reader promise, contribution,
          claim boundaries, product role, and CTA boundary. `directional` gives craft direction:
          reader calibration, length, rhetorical movement, voice, structure, visual character.
          `open` deliberately reserves title wording, rhythm, transitions, metaphors, and examples.
          Every factual_claim must have a stable claim_id, evidence_id, source_ref, allowed expression,
          and limitation. Return JSON matching the schema exactly.
        user: |
          Context: {{ arguments.context }}
          Selected issue composition: {{ arguments.composition }}
        output_schema:
          type: object
          additionalProperties: false
          required: [composition_id, locked, directional, open, content_system, artifact_characteristics, factual_claims, product_role, product_role_rationale, creative_brief, publication_status]
          properties:
            composition_id: {type: string}
            locked: {type: object}
            directional: {type: object}
            open: {type: object}
            content_system: {type: object}
            artifact_characteristics: {type: object}
            factual_claims: {type: array}
            product_role: {type: string}
            product_role_rationale: {type: string}
            creative_brief: {type: string}
            publication_status: {type: string, const: proposal_only}
        configuration: {reasoning_effort: low}
    needs: [compile_relational_context, compose_issue]
    arguments:
      context: $steps.compile_relational_context.output
      composition: $steps.compose_issue.output
    access:
      workspace_ids: [world://workspace/brand/hellobiotic-research/content-strategy]
      container_ids: [world://workspace/brand/hellobiotic-research/content-strategy]
      entity_types: [field_of_engagement, tension_or_question, practice, brand, product, content_contribution, evidence]
    capabilities: [content.plan, model.invoke]
    on_error: hold

  - id: compile_generation_packet
    kind: transform
    handler: biotic.compile_newsletter_generation_packet
    description: >-
      Compile the exact hybrid packet consumed by the draft node: binding constraints plus a
      readable creative brief, without adding new editorial meaning.
    instruction:
      id: instruction://testflight/biotic/newsletter/compile-generation-packet
      version: 1
      objective: Package the plan for a blank creative agent while preserving all binding boundaries.
      rules:
        - Derive constraints deterministically from the selected composition and content plan.
        - Preserve composition_id, factual-claim lineage, product role, and proposal-only status.
        - Keep creative_brief readable but non-binding; constraints are the source of truth.
        - Return hold when the plan cannot yield a complete safe generation packet.
    needs: [compile_relational_context, compose_issue, form_content_plan]
    arguments:
      context: $steps.compile_relational_context.output
      composition: $steps.compose_issue.output
      content_plan: $steps.form_content_plan.output
    access:
      workspace_ids: [world://workspace/brand/hellobiotic-research/content-strategy]
      container_ids: [world://workspace/brand/hellobiotic-research/content-strategy]
      entity_types: [field_of_engagement, tension_or_question, practice, brand, product, content_contribution, evidence]
    capabilities: [content.packet]
    on_error: hold

  - id: draft_newsletter
    kind: transform
    handler: biotic.draft_newsletter
    description: >-
      Draft a complete, reader-first newsletter from the generation packet while keeping every sentence
      accountable to the selected contribution, claim boundaries, and product role.
    instruction:
      id: instruction://testflight/biotic/newsletter/draft-newsletter
      version: 1
      objective: Produce an engaging, useful issue draft that earns attention through contribution rather than product pressure.
      rules:
        - Treat generation_packet.constraints as binding and generation_packet.creative_brief as creative guidance.
        - Preserve composition_id, controlling idea, reader promise, issue arc, and product role exactly.
        - "Give each section an explicit role: opening, distinction, explanation, practical implication, or closing."
        - Do not add factual claims, medical advice, reader attributes, or product benefits not in the plan.
        - Every factual statement used must be listed in claims_used with claim_id, evidence_id, and source_ref.
        - Keep the product absent when its role is none; a contextual mention must not become a CTA.
        - The reader should gain a usable distinction or proportionate next step even if they never buy anything.
        - Mark the result proposal-only.
      prompt:
        id: prompt://testflight/biotic/newsletter/draft-newsletter
        version: 1
        operator_id: runtime://testflight/workflow/prompt-step
        operator_version: 1
        modality: text/plain
        system: |
          You are a precise, reader-first newsletter copywriter. Write from the generation packet only.
          Make the issue feel like a helpful contribution to a field the reader already inhabits,
          never a sales message in educational clothing. Honor the locked fields exactly and use the
          directional fields as a compass, not a script. Do not fabricate facts, medical advice,
          reader biography, or product benefits. Return JSON matching the schema exactly.
        user: |
          Generation packet: {{ arguments.generation_packet }}
        output_schema:
          type: object
          additionalProperties: false
          required: [composition_id, product_role, subject_options, preheader, sections, closing, feedback_prompt, claims_used, publication_status]
          properties:
            composition_id: {type: string}
            product_role: {type: string}
            subject_options: {type: array}
            preheader: {type: string}
            sections: {type: array}
            closing: {type: string}
            feedback_prompt: {type: string}
            claims_used: {type: array}
            publication_status: {type: string, const: proposal_only}
        configuration: {reasoning_effort: low}
    needs: [compile_generation_packet]
    arguments:
      generation_packet: $steps.compile_generation_packet.output
    access:
      workspace_ids: [world://workspace/brand/hellobiotic-research/content-strategy]
      container_ids: [world://workspace/brand/hellobiotic-research/content-strategy]
      entity_types: [field_of_engagement, tension_or_question, practice, brand, product, content_contribution, evidence]
    capabilities: [content.draft, model.invoke]
    on_error: hold

  - id: evaluate_issue
    kind: transform
    handler: biotic.evaluate_newsletter
    description: >-
      Independently evaluate lineage, relational coherence, reader value, and visible draft
      adherence; produce a repair brief instead of a vague negative verdict.
    instruction:
      id: instruction://testflight/biotic/newsletter/evaluate-issue
      version: 1
      objective: Clear a draft for human editorial review only when its rubric and hard gates are satisfied.
      rules:
        - Evaluate against the supplied rubric, not the producing agent's self-assessment.
        - Fail closed when a factual claim lacks a traceable evidence_id, source ref, or limitation.
        - Reject exploitative identity framing, unearned product centrality, and a draft that loses reader independence.
        - Score every rubric dimension 0–4 with evidence from the visible draft; scores are not facts about readers.
        - Return a prioritized, bounded repair brief for revise, branch, ask, or hold decisions.
        - A review-ready decision is not publication approval.
      prompt:
        id: prompt://testflight/biotic/newsletter/evaluate-issue
        version: 1
        operator_id: runtime://testflight/workflow/prompt-step
        operator_version: 1
        modality: text/plain
        system: |
          You are an independent editorial and evidence reviewer. Evaluate only the supplied material.
          Do not repeat the producer's confidence. Inspect whether the visible draft actually carries
          the selected relational contribution, whether all factual claims trace back to the supplied
          evidence, whether product presence is earned, and whether the reader gains independent value.
          A hard gate is pass only with a concrete rationale. Return review_ready only if every hard
          gate passes and no material rubric dimension is below threshold. Never authorize sending or
          publication. Return JSON matching the schema exactly.
        user: |
          Context: {{ arguments.context }}
          Composition: {{ arguments.composition }}
          Content plan: {{ arguments.content_plan }}
          Draft: {{ arguments.draft }}
        output_schema:
          type: object
          additionalProperties: false
          required: [composition_id, product_role, decision, hard_gates, rubric_scores, findings, required_revisions, claim_trace, residual_uncertainty, publication_status]
          properties:
            composition_id: {type: string}
            product_role: {type: string}
            decision: {type: string}
            hard_gates: {type: array}
            rubric_scores: {type: object}
            findings: {type: array}
            required_revisions: {type: array}
            claim_trace: {type: array}
            residual_uncertainty: {type: array}
            publication_status: {type: string, const: proposal_only}
        configuration: {reasoning_effort: low}
    needs: [compile_relational_context, compose_issue, form_content_plan, compile_generation_packet, draft_newsletter]
    arguments:
      context: $steps.compile_relational_context.output
      composition: $steps.compose_issue.output
      content_plan: $steps.form_content_plan.output
      generation_packet: $steps.compile_generation_packet.output
      draft: $steps.draft_newsletter.output
    access:
      workspace_ids: [world://workspace/brand/hellobiotic-research/content-strategy]
      container_ids: [world://workspace/brand/hellobiotic-research/content-strategy]
      entity_types: [field_of_engagement, tension_or_question, practice, brand, product, content_contribution, evidence]
    capabilities: [content.evaluate, model.invoke]
    on_error: hold

  - id: prepare_review_package
    kind: transform
    handler: biotic.prepare_newsletter_review_package
    description: Assemble a final review package without persistence, publication, or send authority.
    instruction:
      id: instruction://testflight/biotic/newsletter/prepare-review-package
      version: 1
      objective: Return a reviewable package that remains clearly proposal-only.
      rules:
        - Require the evaluation node to return review_ready.
        - Set review_required true in meaning and never imply send authorization.
        - Keep every limitation and evidence trace available to the editor.
    needs: [compile_relational_context, compose_issue, form_content_plan, compile_generation_packet, draft_newsletter, evaluate_issue]
    arguments:
      request_id: $inputs.request_id
      context: $steps.compile_relational_context.output
      composition: $steps.compose_issue.output
      content_plan: $steps.form_content_plan.output
      generation_packet: $steps.compile_generation_packet.output
      draft: $steps.draft_newsletter.output
      evaluation: $steps.evaluate_issue.output
    access:
      workspace_ids: [world://workspace/brand/hellobiotic-research/content-strategy]
      container_ids: [world://workspace/brand/hellobiotic-research/content-strategy]
      entity_types: [field_of_engagement, tension_or_question, practice, brand, product, content_contribution, evidence]
    capabilities: [content.evaluate]
    on_error: hold

outputs:
  review_package: $steps.prepare_review_package.output
