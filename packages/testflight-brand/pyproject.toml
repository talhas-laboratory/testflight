[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testflight-brand"
version = "0.1.0"
description = "System-theoretic Brand domain contracts for Testflight"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.10,<3", "pyyaml>=6.0,<7", "testflight-semantic"]

[tool.uv.sources]
testflight-semantic = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/testflight_brand"]
