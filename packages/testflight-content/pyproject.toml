[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testflight-content"
version = "0.1.0"
description = "Provider-independent multimodal Content contracts for Testflight"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.10,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/testflight_content"]
