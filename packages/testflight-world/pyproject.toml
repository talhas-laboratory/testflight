[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testflight-world"
version = "0.1.0"
description = "Provider-neutral Brand World v3 service contracts for Testflight"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.10,<3", "testflight-semantic"]

[tool.uv.sources]
testflight-semantic = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/testflight_world"]
